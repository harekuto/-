name: Bootstrap Legacy Forge Compile Kits

on:
  push:
    branches: [ musordrop-8.3.0-port ]
    paths:
      - '.github/workflows/bootstrap-legacy-forge-kits.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.19.2'
            forge: '43.5.2'
            java: '17'
          - mc: '1.18.2'
            forge: '40.3.12'
            java: '17'
          - mc: '1.16.5'
            forge: '36.2.42'
            java: '8'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Download official Forge MDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/mdk /tmp/kit/classpath /tmp/kit/mdk
          curl --fail --location --retry 5 \
            -o /tmp/mdk.zip \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/${{ matrix.mc }}-${{ matrix.forge }}/forge-${{ matrix.mc }}-${{ matrix.forge }}-mdk.zip"
          unzip -q /tmp/mdk.zip -d /tmp/mdk
          test -f /tmp/mdk/build.gradle
          test -f /tmp/mdk/gradlew
          chmod +x /tmp/mdk/gradlew
      - name: Resolve and export compile classpath
        working-directory: /tmp/mdk
        shell: bash
        run: |
          set -euxo pipefail
          cat >> build.gradle <<'GRADLE'

          tasks.register('exportCompileClasspath', Copy) {
              from configurations.compileClasspath
              into layout.buildDirectory.dir('exported-compile-classpath')
          }
          GRADLE
          ./gradlew --no-daemon clean compileJava exportCompileClasspath --stacktrace
          cp -a build/exported-compile-classpath/. /tmp/kit/classpath/
          cp build.gradle gradle.properties settings.gradle /tmp/kit/mdk/ 2>/dev/null || true
          cp gradlew gradlew.bat /tmp/kit/mdk/ 2>/dev/null || true
          cp -a gradle /tmp/kit/mdk/ 2>/dev/null || true
          printf '%s\n' "java=${{ matrix.java }}" "minecraft=${{ matrix.mc }}" "forge=${{ matrix.forge }}" > /tmp/kit/VERSIONS.txt
          find /tmp/kit/classpath -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/kit/CLASSPATH-SHA256SUMS.txt
          find /tmp/kit/classpath -maxdepth 1 -type f -printf '%f %s\n' | sort > /tmp/kit/classpath-files.txt
          du -sh /tmp/kit /tmp/kit/classpath
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-${{ matrix.mc }}-${{ matrix.forge }}-Compile-Kit
          path: /tmp/kit
          if-no-files-found: error
