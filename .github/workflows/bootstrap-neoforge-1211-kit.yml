name: Bootstrap NeoForge 1.21.1 Compile Kit

on:
  push:
    branches: [ musordrop-8.3.0-port ]
    paths:
      - '.github/workflows/bootstrap-neoforge-1211-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone official NeoForge 1.21.1 ModDevGradle MDK
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle.git /tmp/mdk
          grep -q '^minecraft_version=1.21.1$' /tmp/mdk/gradle.properties
          grep -q '^neo_version=21.1.250$' /tmp/mdk/gradle.properties
          grep -q "net.neoforged.moddev' version '2.0.147'" /tmp/mdk/build.gradle
      - name: Resolve and export compile classpath
        working-directory: /tmp/mdk
        shell: bash
        run: |
          set -euxo pipefail
          cat >> build.gradle <<'GRADLE'
          tasks.register('exportCompileClasspath', Copy) {
              from configurations.compileClasspath
              into layout.buildDirectory.dir('exported-compile-classpath')
          }
          GRADLE
          ./gradlew --no-daemon clean compileJava exportCompileClasspath --stacktrace
          mkdir -p /tmp/kit/classpath /tmp/kit/mdk
          cp -a build/exported-compile-classpath/. /tmp/kit/classpath/
          cp build.gradle gradle.properties settings.gradle /tmp/kit/mdk/
          cp -a src/main/templates /tmp/kit/mdk/templates
          printf '%s\n' "java=21" "minecraft=1.21.1" "neoforge=21.1.250" "moddevgradle=2.0.147" > /tmp/kit/VERSIONS.txt
          find /tmp/kit/classpath -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/kit/CLASSPATH-SHA256SUMS.txt
          du -sh /tmp/kit /tmp/kit/classpath
          find /tmp/kit/classpath -maxdepth 1 -type f -printf '%f %s\n' | sort > /tmp/kit/classpath-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NeoForge-1.21.1-21.1.250-Compile-Kit
          path: /tmp/kit
          if-no-files-found: error
