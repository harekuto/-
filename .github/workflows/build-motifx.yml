name: Build MotifX MVP

on:
  push:
    branches:
      - motifx-mvp-build
    paths:
      - 'motifx/**'
      - '.github/workflows/build-motifx.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Static source and resource checks
        shell: bash
        run: |
          set -euxo pipefail
          test -f motifx/build.gradle
          test -f motifx/src/main/resources/META-INF/mods.toml
          test "$(find motifx/src/main/java -name '*.java' | wc -l)" -ge 20
          test "$(find motifx/src/test/java -name '*Test.java' | wc -l)" -ge 6
          ! grep -R --line-number --fixed-string 'catch (Throwable' motifx/src/main/java
          ! grep -R --line-number --fixed-string 'System.out.' motifx/src/main/java
          python3 -m json.tool motifx/src/main/resources/assets/motifx/lang/en_us.json >/dev/null
          python3 -m json.tool motifx/src/main/resources/assets/motifx/lang/ru_ru.json >/dev/null
          python3 -m json.tool motifx/src/main/resources/assets/motifx/motif/demo_wave.json >/dev/null
          python3 -m json.tool motifx/src/main/resources/pack.mcmeta >/dev/null

      - name: Clean test and Forge build
        working-directory: motifx
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon clean test build --stacktrace

      - name: Verify built JAR
        working-directory: motifx
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah build/libs
          JAR="$(find build/libs -maxdepth 1 -type f -name 'motifx-0.1.0.jar' | head -n1)"
          test -n "$JAR"
          unzip -t "$JAR"
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'modId="motifx"'
          unzip -l "$JAR" | grep -q 'dev/harekuto/motifx/MotifX.class'
          unzip -l "$JAR" | grep -q 'dev/harekuto/motifx/client/MotifInspectorScreen.class'
          unzip -l "$JAR" | grep -q 'assets/motifx/motif/demo_wave.json'
          sha256sum "$JAR" | tee build/libs/SHA256SUMS.txt

      - name: Dedicated server classloading smoke
        working-directory: motifx
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          : > server-smoke.log
          gradle --no-daemon runServer > server-smoke.log 2>&1 &
          SERVER_PID=$!
          FOUND=0
          for _ in $(seq 1 90); do
            if grep -q 'MotifX 0.1.0 initialized' server-smoke.log; then FOUND=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 180 server-smoke.log
          if [ "$FOUND" -ne 1 ]; then
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          ! grep -q 'NoClassDefFoundError' server-smoke.log
          ! grep -qi 'invalid dist' server-smoke.log
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotifX-0.1.0-Forge-1.20.1
          path: |
            motifx/build/libs/motifx-0.1.0.jar
            motifx/build/libs/motifx-0.1.0-sources.jar
            motifx/build/libs/SHA256SUMS.txt
            motifx/build/reports/tests/test/
            motifx/server-smoke.log
          if-no-files-found: error
