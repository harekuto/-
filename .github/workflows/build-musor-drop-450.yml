name: Build Musor Drop 4.5.0 Premium

on:
  push:
    branches: [ musor-4.5.0-premium ]
    paths:
      - 'build-input/premium440/**'
      - '.github/workflows/build-musor-drop-450.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct complete premium source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/musor-premium.zip musor-drop
          : > /tmp/musor-premium.zip
          for p in $(find build-input/premium440 -maxdepth 1 -type f -name 'part-*.b64' | sort); do
            base64 -d "$p" >> /tmp/musor-premium.zip
          done
          ls -lh /tmp/musor-premium.zip
          unzip -tq /tmp/musor-premium.zip
          mkdir -p musor-drop
          unzip -q /tmp/musor-premium.zip -d musor-drop
          if [ ! -f musor-drop/build.gradle ]; then
            ROOT="$(find musor-drop -mindepth 1 -maxdepth 3 -type f -name build.gradle -printf '%h\n' | head -n1)"
            test -n "$ROOT"
            TMP="$(mktemp -d)"
            cp -a "$ROOT"/. "$TMP"/
            rm -rf musor-drop
            mkdir musor-drop
            cp -a "$TMP"/. musor-drop/
            rm -rf "$TMP"
          fi
          test -f musor-drop/build.gradle
          test -f musor-drop/gradle.properties
          sed -i 's/^mod_version=.*/mod_version=4.5.0/' musor-drop/gradle.properties
          sed -i 's|^mod_description=.*|mod_description=Musor Drop Premium 4.5: hardened server-authoritative economy, polished purple Minecraft-style UI, 224 cases, 3D case models, upgrade, selling and premium UX.|' musor-drop/gradle.properties
          grep -q '^minecraft_version=1.20.1$' musor-drop/gradle.properties
          grep -q '^forge_version=47.4.10$' musor-drop/gradle.properties
          grep -q '^mod_version=4.5.0$' musor-drop/gradle.properties
          grep -R -q 'MODID = "musordrop"' musor-drop/src/main/java
          grep -R -q 'ITEMS.register("station"' musor-drop/src/main/java
          grep -R -q 'MENUS.register("station"' musor-drop/src/main/java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Static and resource audit
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -R --line-number --fixed-string 'catch (Throwable' musor-drop/src/main/java
          ! grep -R --line-number -E 'm_[0-9]{3,}_' musor-drop/src/main/java
          ! grep -R --line-number --fixed-string 'System.out.' musor-drop/src/main/java
          ! grep -R --line-number --fixed-string 'Runtime.exec' musor-drop/src/main/java
          ! grep -R --line-number --fixed-string 'ProcessBuilder' musor-drop/src/main/java
          ! grep -R --line-number --fixed-string 'Minecraft.getInstance().setScreen' musor-drop/src/main/java
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('musor-drop/src/main/resources')
          jc=pc=0
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8')); jc+=1
          for p in root.rglob('*.png'):
              d=p.read_bytes(); assert d[:8] == b'\x89PNG\r\n\x1a\n', p; pc+=1
          models=list((root/'assets/musordrop/models/item/case_models').glob('*.json'))
          textures=list((root/'assets/musordrop/textures/item/cases').glob('*.png'))
          assert len(models) >= 29, len(models)
          assert len(textures) >= 29, len(textures)
          print('RESOURCE_AUDIT_OK JSON',jc,'PNG',pc,'CASE_MODELS',len(models),'CASE_TEXTURES',len(textures))
          PY

      - name: Clean tests and Forge production build
        working-directory: musor-drop
        shell: bash
        run: gradle --no-daemon clean test build --stacktrace

      - name: Verify JUnit suite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('musor-drop/build/test-results/test').glob('TEST-*.xml')); assert files
          tests=failures=errors=skipped=0
          for f in files:
              r=ET.parse(f).getroot(); tests+=int(r.attrib.get('tests',0)); failures+=int(r.attrib.get('failures',0)); errors+=int(r.attrib.get('errors',0)); skipped+=int(r.attrib.get('skipped',0))
          print('JUNIT_TOTAL',tests,'FAILURES',failures,'ERRORS',errors,'SKIPPED',skipped)
          assert tests >= 12000 and failures == 0 and errors == 0
          Path('musor-drop/build/test-count.txt').write_text(f'JUnit tests: {tests}\nFailures: {failures}\nErrors: {errors}\nSkipped: {skipped}\n')
          PY

      - name: Production JAR audit
        working-directory: musor-drop
        shell: bash
        run: |
          set -euxo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          FINAL='build/libs/Musor-Drop-4.5.0-Forge-1.20.1-Premium.jar'
          test -n "$JAR"
          cp "$JAR" "$FINAL"
          unzip -t "$FINAL"
          unzip -p "$FINAL" META-INF/mods.toml | grep -q 'modId="musordrop"'
          python3 - <<'PY'
          import json,re,struct,zipfile
          from pathlib import Path
          jar=Path('build/libs/Musor-Drop-4.5.0-Forge-1.20.1-Premium.jar')
          bad=[]; classes=jsons=pngs=0
          secret=re.compile(rb'(sk-[A-Za-z0-9_-]{20,}|discord(?:app)?\.com/api/webhooks|BEGIN (?:RSA|OPENSSH|EC) PRIVATE KEY|api[_-]?key\s*[=:])',re.I)
          with zipfile.ZipFile(jar) as z:
              names=set(z.namelist())
              required={'data/musordrop/recipes/station.json'}
              for n in z.namelist():
                  d=z.read(n)
                  if n.endswith('.class'):
                      classes+=1
                      if d[:4]!=b'\xca\xfe\xba\xbe' or struct.unpack('>H',d[6:8])[0]!=61: bad.append((n,'class'))
                  elif n.endswith('.json'):
                      json.loads(d.decode()); jsons+=1
                  elif n.endswith('.png'):
                      pngs+=1
                      if d[:8]!=b'\x89PNG\r\n\x1a\n': bad.append((n,'png'))
                  if secret.search(d): bad.append((n,'secret'))
              for r in required:
                  if r not in names: bad.append((r,'missing'))
              junk=re.compile(r'(^|/)(src|stubs|test-classes|\.gradle|logs|crash-reports|__pycache__|\.env)(/|$)')
              for n in names:
                  if junk.search(n): bad.append((n,'junk'))
          print('CLASSES',classes,'JSON',jsons,'PNG',pngs,'BAD',bad)
          assert classes>=34 and not bad
          PY
          sha256sum "$FINAL" | tee build/libs/SHA256SUMS.txt

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musor-Drop-4.5.0-Forge-1.20.1-Premium
          path: |
            musor-drop/build/libs/Musor-Drop-4.5.0-Forge-1.20.1-Premium.jar
            musor-drop/build/libs/SHA256SUMS.txt
            musor-drop/build/test-count.txt
          if-no-files-found: error
