name: Build Musor Drop 4.7.0 UI Rebuild

on:
  push:
    branches: [ musor-4.7.0-ui-rebuild ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct project
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main --depth=1
          rm -rf /tmp/base-input /tmp/musor-base.zip /tmp/musor-stability.zip musor-drop
          mkdir -p /tmp/base-input musor-drop
          git archive --format=tar origin/main build-input | tar -xf - -C /tmp/base-input
          cat /tmp/base-input/build-input/part-*.b64 | base64 -d > /tmp/musor-base.zip
          unzip -tq /tmp/musor-base.zip
          unzip -q /tmp/musor-base.zip -d musor-drop

          MAIN='musor-drop/src/main/java/net/execheinz/upgrader/Upgrader.java'
          ITEMS='musor-drop/src/main/java/net/execheinz/upgrader/registry/ModItems.java'
          MENUS='musor-drop/src/main/java/net/execheinz/upgrader/registry/ModMenus.java'
          ITEM='musor-drop/src/main/java/net/execheinz/upgrader/item/UpgraderItem.java'
          SCREEN='musor-drop/src/main/java/net/execheinz/upgrader/client/screen/UpgraderScreen.java'

          sed -i 's/public static final String MODID = "upgrader";/public static final String MODID = "musordrop";/' "$MAIN" || true
          sed -i 's/ITEMS.register("upgrader",/ITEMS.register("station",/' "$ITEMS" || true
          sed -i 's/MENUS.register("upgrader",/MENUS.register("station",/' "$MENUS" || true
          sed -i 's/"menu.upgrader.title"/"menu.musordrop.title"/' "$ITEM" || true
          sed -i 's/renderTooltip(g, mouseX, mouseY);/renderCaseTooltip(g, mouseX, mouseY);/' "$SCREEN" || true
          sed -i 's/private void renderTooltip(GuiGraphics g, int mouseX, int mouseY)/private void renderCaseTooltip(GuiGraphics g, int mouseX, int mouseY)/' "$SCREEN" || true

          if [ -d musor-drop/src/main/resources/assets/upgrader ]; then mv musor-drop/src/main/resources/assets/upgrader musor-drop/src/main/resources/assets/musordrop; fi
          if [ -d musor-drop/src/main/resources/data/upgrader ]; then mv musor-drop/src/main/resources/data/upgrader musor-drop/src/main/resources/data/musordrop; fi
          if [ -f musor-drop/src/main/resources/assets/musordrop/models/item/upgrader.json ]; then mv musor-drop/src/main/resources/assets/musordrop/models/item/upgrader.json musor-drop/src/main/resources/assets/musordrop/models/item/station.json; fi
          if [ -f musor-drop/src/main/resources/data/musordrop/recipes/upgrader.json ]; then mv musor-drop/src/main/resources/data/musordrop/recipes/upgrader.json musor-drop/src/main/resources/data/musordrop/recipes/station.json; fi
          find musor-drop/src/main/resources -type f -name '*.json' -print0 | xargs -0 -r sed -i -e 's/upgrader:/musordrop:/g' -e 's/musordrop:upgrader/musordrop:station/g'

          cat build-input/stability/part-*.b64 | base64 -d > /tmp/musor-stability.zip
          unzip -tq /tmp/musor-stability.zip
          unzip -qo /tmp/musor-stability.zip -d musor-drop
          cp -a build-input/unified-src/src/. musor-drop/src/
          python3 build-input/unified-src/generate_visual_assets.py
          python3 build-input/unified-src/apply_ui_470.py musor-drop
          python3 build-input/unified-src/apply_support_page.py musor-drop
          sed -i 's/^mod_version=.*/mod_version=4.7.0/' musor-drop/gradle.properties

          grep -q '^minecraft_version=1.20.1$' musor-drop/gradle.properties
          grep -q '^forge_version=47.4.10$' musor-drop/gradle.properties
          grep -q '^mod_id=musordrop$' musor-drop/gradle.properties
          grep -q '^mod_version=4.7.0$' musor-drop/gradle.properties
          grep -q 'GUI_W = 352' musor-drop/src/main/java/net/execheinz/upgrader/menu/StationLayout.java
          grep -q 'Support intentionally does not render container slots' "$SCREEN"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build and test
        working-directory: musor-drop
        run: gradle --no-daemon clean test build --stacktrace

      - name: Collect test count and production jar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('musor-drop/build/test-results/test').glob('TEST-*.xml'))
          assert files
          tests=failures=errors=skipped=0
          for f in files:
              root=ET.parse(f).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print('JUNIT_TOTAL', tests, 'FAILURES', failures, 'ERRORS', errors, 'SKIPPED', skipped)
          assert tests >= 12000 and failures == 0 and errors == 0
          Path('musor-drop/build/test-count.txt').write_text(f'JUnit tests: {tests}\nFailures: {failures}\nErrors: {errors}\nSkipped: {skipped}\n')
          PY
          JAR="$(find musor-drop/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          FINAL='musor-drop/build/libs/Musor-Drop-4.7.0-Forge-1.20.1-Premium-UI-Rebuild.jar'
          cp "$JAR" "$FINAL"
          unzip -t "$FINAL"
          sha256sum "$FINAL" > musor-drop/build/libs/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Musor-Drop-4.7.0-Forge-1.20.1-Premium-UI-Rebuild
          path: |
            musor-drop/build/libs/Musor-Drop-4.7.0-Forge-1.20.1-Premium-UI-Rebuild.jar
            musor-drop/build/libs/SHA256SUMS.txt
            musor-drop/build/test-count.txt
          if-no-files-found: error
