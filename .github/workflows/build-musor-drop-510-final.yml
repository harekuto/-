name: Build Musor Drop 5.1.0 Premium GUI Final

on:
  push:
    branches: [ musor-5.1.0-gui-overhaul ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified baseline and 5.1 source
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main --depth=1
          rm -rf /tmp/base-input /tmp/musor-base.zip /tmp/musor-stability.zip /tmp/apply-ui-490.py /tmp/apply-assets-490.py /tmp/musor500.patch /tmp/musor510.patch /tmp/case510.zip musor-drop
          mkdir -p /tmp/base-input musor-drop
          git archive --format=tar origin/main build-input | tar -xf - -C /tmp/base-input
          cat /tmp/base-input/build-input/part-*.b64 | base64 -d > /tmp/musor-base.zip
          unzip -tq /tmp/musor-base.zip
          unzip -q /tmp/musor-base.zip -d musor-drop

          MAIN='musor-drop/src/main/java/net/execheinz/upgrader/Upgrader.java'
          ITEMS='musor-drop/src/main/java/net/execheinz/upgrader/registry/ModItems.java'
          MENUS='musor-drop/src/main/java/net/execheinz/upgrader/registry/ModMenus.java'
          ITEM='musor-drop/src/main/java/net/execheinz/upgrader/item/UpgraderItem.java'
          SCREEN='musor-drop/src/main/java/net/execheinz/upgrader/client/screen/UpgraderScreen.java'
          sed -i 's/public static final String MODID = "upgrader";/public static final String MODID = "musordrop";/' "$MAIN" || true
          sed -i 's/ITEMS.register("upgrader",/ITEMS.register("station",/' "$ITEMS" || true
          sed -i 's/MENUS.register("upgrader",/MENUS.register("station",/' "$MENUS" || true
          sed -i 's/"menu.upgrader.title"/"menu.musordrop.title"/' "$ITEM" || true
          sed -i 's/renderTooltip(g, mouseX, mouseY);/renderCaseTooltip(g, mouseX, mouseY);/' "$SCREEN" || true
          sed -i 's/private void renderTooltip(GuiGraphics g, int mouseX, int mouseY)/private void renderCaseTooltip(GuiGraphics g, int mouseX, int mouseY)/' "$SCREEN" || true
          [ ! -d musor-drop/src/main/resources/assets/upgrader ] || mv musor-drop/src/main/resources/assets/upgrader musor-drop/src/main/resources/assets/musordrop
          [ ! -d musor-drop/src/main/resources/data/upgrader ] || mv musor-drop/src/main/resources/data/upgrader musor-drop/src/main/resources/data/musordrop
          [ ! -f musor-drop/src/main/resources/assets/musordrop/models/item/upgrader.json ] || mv musor-drop/src/main/resources/assets/musordrop/models/item/upgrader.json musor-drop/src/main/resources/assets/musordrop/models/item/station.json
          [ ! -f musor-drop/src/main/resources/data/musordrop/recipes/upgrader.json ] || mv musor-drop/src/main/resources/data/musordrop/recipes/upgrader.json musor-drop/src/main/resources/data/musordrop/recipes/station.json
          find musor-drop/src/main/resources -type f -name '*.json' -print0 | xargs -0 -r sed -i -e 's/upgrader:/musordrop:/g' -e 's/musordrop:upgrader/musordrop:station/g'

          cat build-input/stability/part-*.b64 | base64 -d > /tmp/musor-stability.zip
          unzip -tq /tmp/musor-stability.zip
          unzip -qo /tmp/musor-stability.zip -d musor-drop
          cp -a build-input/unified-src/src/. musor-drop/src/
          python3 build-input/unified-src/generate_visual_assets.py
          python3 build-input/unified-src/apply_ui_470.py musor-drop
          python3 build-input/unified-src/prepare_support_480.py musor-drop
          python3 build-input/unified-src/apply_support_page.py musor-drop
          python3 build-input/unified-src/apply_ui_480.py musor-drop
          base64 -d build-input/unified-src/apply_ui_490.py.gz.b64 | gzip -dc > /tmp/apply-ui-490.py
          base64 -d build-input/unified-src/apply_assets_490.py.gz.b64 | gzip -dc > /tmp/apply-assets-490.py
          python3 /tmp/apply-ui-490.py musor-drop
          python3 /tmp/apply-assets-490.py musor-drop

          base64 -d build-input/musor-500-ui.patch.gz.b64 | gzip -dc > /tmp/musor500.patch
          set +e
          patch -p1 -d musor-drop < /tmp/musor500.patch
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            test "$(find musor-drop -name '*.rej' -print)" = 'musor-drop/gradle.properties.rej'
          fi
          rm -f musor-drop/gradle.properties.rej
          base64 -d build-input/station500.png.b64 > musor-drop/src/main/resources/assets/musordrop/textures/item/station.png
          python3 build-input/apply_501_run9.py musor-drop

          cat build-input/musor-510-ui.part*.b64 | base64 -d | gzip -dc > /tmp/musor510.patch
          echo 'cc03157b4c271200c10bb5db164099153d1d85329090a0c62559bebe42398893  /tmp/musor510.patch' | sha256sum -c -
          patch -p1 -d musor-drop < /tmp/musor510.patch
          test -z "$(find musor-drop -name '*.rej' -print)"

          cat build-input/case-textures-510.part*.b64 | base64 -d > /tmp/case510.zip
          unzip -tq /tmp/case510.zip
          unzip -qo /tmp/case510.zip -d musor-drop/src/main/resources/assets/musordrop/textures/item/cases

          sed -i 's/^mod_version=.*/mod_version=5.1.0/' musor-drop/gradle.properties
          sed -i 's|^mod_description=.*|mod_description=Musor Drop 5.1 professional Forge 1.20.1 station with premium redesigned GUI, themed case art, hardened server-authoritative economy, durable rewards, modded-item support, Musor Shards, selling and 224 cases.|' musor-drop/gradle.properties
          grep -q '^minecraft_version=1.20.1$' musor-drop/gradle.properties
          grep -q '^forge_version=47.4.10$' musor-drop/gradle.properties
          grep -q '^mod_id=musordrop$' musor-drop/gradle.properties
          grep -q '^mod_version=5.1.0$' musor-drop/gradle.properties
          echo RECONSTRUCT_510_FINAL_OK

      - name: Static GUI resource and security audit
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -R --line-number --fixed-string 'catch (Throwable' musor-drop/src/main/java
          ! grep -R --line-number --fixed-string 'Runtime.exec' musor-drop/src/main/java
          ! grep -R --line-number --fixed-string 'ProcessBuilder' musor-drop/src/main/java
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('musor-drop/src/main/resources')
          for p in root.rglob('*.json'): json.loads(p.read_text(encoding='utf-8'))
          for p in root.rglob('*.png'): assert p.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n', p
          station=Path('musor-drop/src/main/java/net/execheinz/upgrader/menu/StationLayout.java').read_text()
          cases=Path('musor-drop/src/main/java/net/execheinz/upgrader/client/screen/CaseLayout.java').read_text()
          screen=Path('musor-drop/src/main/java/net/execheinz/upgrader/client/screen/UpgraderScreen.java').read_text()
          assert 'GUI_W = 360' in station and 'GUI_H = 252' in station
          for token in ('GRID_X = 10','GRID_Y = 59','CARD_W = 108','CARD_H = 43','GAP_X = 6','GAP_Y = 5','PAGE_SIZE = 6'): assert token in cases, token
          for token in ('drawSearchGlyph','drawExternalLinkGlyph','safeUnitValue'): assert token in screen, token
          textures=list((root/'assets/musordrop/textures/item/cases').glob('*.png'))
          assert len(textures)==29, len(textures)
          print('STATIC_510_FINAL_OK', len(textures))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Forge production build and tests
        working-directory: musor-drop
        run: gradle --no-daemon clean test build --stacktrace

      - name: Verify fresh release JAR
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('musor-drop/build/test-results/test').glob('TEST-*.xml')); assert files
          t=f=e=s=0
          for p in files:
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          print('JUNIT_TOTAL',t,'FAILURES',f,'ERRORS',e,'SKIPPED',s)
          assert t>=12000 and f==0 and e==0
          Path('musor-drop/build/test-count.txt').write_text(f'JUnit tests: {t}\nFailures: {f}\nErrors: {e}\nSkipped: {s}\n')
          PY
          JAR="$(find musor-drop/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          FINAL='musor-drop/build/libs/Musor-Drop-5.1.0-Forge-1.20.1-Premium-GUI.jar'
          test -n "$JAR"; cp "$JAR" "$FINAL"; unzip -tq "$FINAL"
          unzip -p "$FINAL" META-INF/mods.toml | grep -q 'modId="musordrop"'
          unzip -p "$FINAL" META-INF/mods.toml | grep -q 'version="5.1.0"'
          python3 - <<'PY'
          import json,struct,zipfile
          from pathlib import Path
          jar=Path('musor-drop/build/libs/Musor-Drop-5.1.0-Forge-1.20.1-Premium-GUI.jar')
          with zipfile.ZipFile(jar) as z:
              names=set(z.namelist()); classes=case_models=case_textures=0
              for n in names:
                  d=z.read(n)
                  if n.endswith('.class'):
                      classes+=1; assert d[:4]==b'\xca\xfe\xba\xbe' and struct.unpack('>H',d[6:8])[0]==61, n
                  if n.endswith('.json'): json.loads(d.decode('utf-8'))
                  if '/models/item/case_models/' in n and n.endswith('.json'): case_models+=1
                  if '/textures/item/cases/' in n and n.endswith('.png'): case_textures+=1
              for req in ('assets/musordrop/textures/item/station.png','net/execheinz/upgrader/client/screen/UpgraderScreen.class','net/execheinz/upgrader/network/ModNetwork.class'):
                  assert req in names, req
              assert classes>=35 and case_models==29 and case_textures==29, (classes,case_models,case_textures)
              print('JAR_AUDIT_510_FINAL_OK',classes,case_models,case_textures)
          PY
          sha256sum "$FINAL" | tee musor-drop/build/libs/SHA256SUMS.txt
          (cd musor-drop && zip -qr build/Musor-Drop-5.1.0-SOURCE.zip src build.gradle gradle.properties settings.gradle)

      - uses: actions/upload-artifact@v4
        with:
          name: Musor-Drop-5.1.0-Forge-1.20.1-Premium-GUI-Final
          path: |
            musor-drop/build/libs/Musor-Drop-5.1.0-Forge-1.20.1-Premium-GUI.jar
            musor-drop/build/libs/SHA256SUMS.txt
            musor-drop/build/test-count.txt
            musor-drop/build/Musor-Drop-5.1.0-SOURCE.zip
          if-no-files-found: error
