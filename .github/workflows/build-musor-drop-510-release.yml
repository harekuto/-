name: Release Musor Drop 5.1.0 Premium GUI

on:
  push:
    branches: [ musor-5.1.0-release ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified 5.0.1 source baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/base501 musor-drop
          mkdir -p /tmp/base501 musor-drop
          gh run download 33848702782 \
            --repo "$GITHUB_REPOSITORY" \
            --name 'Musor-Drop-5.0.1-Forge-1.20.1-Hardened-Professional' \
            --dir /tmp/base501
          SOURCE="$(find /tmp/base501 -type f -name '*SOURCE.zip' | head -n1)"
          test -n "$SOURCE"
          unzip -tq "$SOURCE"
          unzip -q "$SOURCE" -d musor-drop
          test -f musor-drop/build.gradle
          grep -q '^minecraft_version=1.20.1$' musor-drop/gradle.properties
          grep -q '^forge_version=47.4.10$' musor-drop/gradle.properties
          grep -q '^mod_id=musordrop$' musor-drop/gradle.properties
          echo BASELINE_501_SOURCE_OK

      - name: Apply verified 5.1 GUI and themed case assets
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d build-input/musor-510-ui.patch.gz.b64 | gzip -dc > /tmp/musor510.patch
          test -s /tmp/musor510.patch
          patch -p1 -d musor-drop < /tmp/musor510.patch
          test -z "$(find musor-drop -name '*.rej' -print)"

          TEST='musor-drop/src/test/java/net/execheinz/upgrader/client/screen/CaseLayoutTest.java'
          sed -i 's/<= 170/<= 172/' "$TEST"
          grep -q '<= 172' "$TEST"

          cat build-input/case-textures-510.part*.b64 | base64 -d > /tmp/case510.zip
          unzip -tq /tmp/case510.zip
          unzip -qo /tmp/case510.zip -d musor-drop/src/main/resources/assets/musordrop/textures/item/cases

          sed -i 's/^mod_version=.*/mod_version=5.1.0/' musor-drop/gradle.properties
          sed -i 's|^mod_description=.*|mod_description=Musor Drop 5.1.0 premium Forge 1.20.1 station with professionally redesigned GUI, themed case art, hardened server-authoritative economy, durable rewards, modded-item support, Musor Shards, selling and 224+ cases.|' musor-drop/gradle.properties

          grep -q '^mod_version=5.1.0$' musor-drop/gradle.properties
          grep -q 'GUI_W = 360' musor-drop/src/main/java/net/execheinz/upgrader/menu/StationLayout.java
          grep -q 'GUI_H = 252' musor-drop/src/main/java/net/execheinz/upgrader/menu/StationLayout.java
          grep -q 'GRID_X = 10' musor-drop/src/main/java/net/execheinz/upgrader/client/screen/CaseLayout.java
          grep -q 'GRID_Y = 59' musor-drop/src/main/java/net/execheinz/upgrader/client/screen/CaseLayout.java
          grep -q 'CARD_W = 108' musor-drop/src/main/java/net/execheinz/upgrader/client/screen/CaseLayout.java
          grep -q 'CARD_H = 43' musor-drop/src/main/java/net/execheinz/upgrader/client/screen/CaseLayout.java
          grep -q 'PAGE_SIZE = 6' musor-drop/src/main/java/net/execheinz/upgrader/client/screen/CaseLayout.java
          grep -q 'drawSearchGlyph' musor-drop/src/main/java/net/execheinz/upgrader/client/screen/UpgraderScreen.java
          grep -q 'drawExternalLinkGlyph' musor-drop/src/main/java/net/execheinz/upgrader/client/screen/UpgraderScreen.java
          grep -q 'enum Icon' musor-drop/src/main/java/net/execheinz/upgrader/client/screen/MusorButton.java
          echo GUI_510_APPLY_OK

      - name: Static resource and client-server audit
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -R --line-number --fixed-string 'catch (Throwable' musor-drop/src/main/java
          ! grep -R --line-number --fixed-string 'Runtime.exec' musor-drop/src/main/java
          ! grep -R --line-number --fixed-string 'ProcessBuilder' musor-drop/src/main/java
          grep -q 'NetworkDirection.PLAY_TO_SERVER' musor-drop/src/main/java/net/execheinz/upgrader/network/ModNetwork.java
          grep -q 'NetworkDirection.PLAY_TO_CLIENT' musor-drop/src/main/java/net/execheinz/upgrader/network/ModNetwork.java
          grep -q 'WARN_PENDING' musor-drop/src/main/java/net/execheinz/upgrader/economy/PendingRewardService.java
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('musor-drop/src/main/resources')
          jc=pc=0
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8')); jc += 1
          for p in root.rglob('*.png'):
              assert p.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n', p; pc += 1
          case_dir=root/'assets/musordrop/textures/item/cases'
          textures=list(case_dir.glob('*.png'))
          assert len(textures)==29, len(textures)
          print('RESOURCE_AUDIT_OK', jc, pc, len(textures))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Forge production build and tests
        working-directory: musor-drop
        run: gradle --no-daemon clean test build --stacktrace

      - name: Verify fresh 5.1 release
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('musor-drop/build/test-results/test').glob('TEST-*.xml')); assert files
          t=f=e=s=0
          for p in files:
              r=ET.parse(p).getroot()
              t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          print('JUNIT_TOTAL',t,'FAILURES',f,'ERRORS',e,'SKIPPED',s)
          assert t>=12000 and f==0 and e==0
          Path('musor-drop/build/test-count.txt').write_text(f'JUnit tests: {t}\nFailures: {f}\nErrors: {e}\nSkipped: {s}\n')
          PY

          JAR="$(find musor-drop/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          FINAL='musor-drop/build/libs/Musor-Drop-5.1.0-Forge-1.20.1-Premium-GUI.jar'
          test -n "$JAR"
          cp "$JAR" "$FINAL"
          unzip -tq "$FINAL"
          unzip -p "$FINAL" META-INF/mods.toml | grep -q 'modId="musordrop"'
          unzip -p "$FINAL" META-INF/mods.toml | grep -q 'displayName="Musor Drop"'
          unzip -p "$FINAL" META-INF/mods.toml | grep -q 'version="5.1.0"'

          python3 - <<'PY'
          import json,struct,zipfile
          from pathlib import Path
          jar=Path('musor-drop/build/libs/Musor-Drop-5.1.0-Forge-1.20.1-Premium-GUI.jar')
          classes=case_models=case_textures=0
          with zipfile.ZipFile(jar) as z:
              names=set(z.namelist())
              for n in names:
                  d=z.read(n)
                  if n.endswith('.class'):
                      classes+=1
                      assert d[:4]==b'\xca\xfe\xba\xbe' and struct.unpack('>H',d[6:8])[0]==61, n
                  elif n.endswith('.json'):
                      json.loads(d.decode('utf-8'))
                  if '/models/item/case_models/' in n and n.endswith('.json'): case_models+=1
                  if '/textures/item/cases/' in n and n.endswith('.png'): case_textures+=1
              required={
                  'assets/musordrop/models/item/station.json',
                  'assets/musordrop/textures/item/station.png',
                  'net/execheinz/upgrader/client/screen/UpgraderScreen.class',
                  'net/execheinz/upgrader/client/screen/MusorTheme.class',
                  'net/execheinz/upgrader/client/screen/MusorButton.class',
                  'net/execheinz/upgrader/network/ModNetwork.class'
              }
              assert required <= names, required-names
              assert classes>=35 and case_models==29 and case_textures==29, (classes,case_models,case_textures)
              print('JAR_AUDIT_OK',classes,case_models,case_textures)
          PY

          sha256sum "$FINAL" | tee musor-drop/build/libs/SHA256SUMS.txt
          (cd musor-drop && zip -qr build/Musor-Drop-5.1.0-SOURCE.zip src build.gradle gradle.properties settings.gradle)

      - uses: actions/upload-artifact@v4
        with:
          name: Musor-Drop-5.1.0-Forge-1.20.1-Premium-GUI-Release
          path: |
            musor-drop/build/libs/Musor-Drop-5.1.0-Forge-1.20.1-Premium-GUI.jar
            musor-drop/build/libs/SHA256SUMS.txt
            musor-drop/build/test-count.txt
            musor-drop/build/Musor-Drop-5.1.0-SOURCE.zip
          if-no-files-found: error
