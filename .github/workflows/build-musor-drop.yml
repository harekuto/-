name: Build Musor Drop

on:
  push:
    paths:
      - 'build-input/**'
      - '.github/workflows/build-musor-drop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p musor-drop
          cat build-input/part-*.b64 | base64 -d > /tmp/musor-drop-source.zip
          unzip -q /tmp/musor-drop-source.zip -d musor-drop
          test -f musor-drop/build.gradle
          test -f musor-drop/src/main/java/net/execheinz/upgrader/Upgrader.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Static source checks
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -R --line-number --fixed-string 'catch (Throwable' musor-drop/src/main/java
          ! grep -R --line-number -E 'm_[0-9]{3,}_' musor-drop/src/main/java
          ! grep -R --line-number --fixed-string 'System.out.' musor-drop/src/main/java
          test "$(find musor-drop/src/main/java -name '*.java' | wc -l)" -ge 20

      - name: Clean test and Forge build
        working-directory: musor-drop
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon clean test build --stacktrace

      - name: Verify artifact
        working-directory: musor-drop
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah build/libs
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          test -n "$JAR"
          unzip -t "$JAR"
          sha256sum "$JAR" | tee build/libs/SHA256SUMS.txt
          cp "$JAR" build/libs/Musor-Drop-4.0.0-Forge-1.20.1.jar

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: Musor-Drop-4.0.0-Forge-1.20.1
          path: |
            musor-drop/build/libs/Musor-Drop-4.0.0-Forge-1.20.1.jar
            musor-drop/build/libs/SHA256SUMS.txt
          if-no-files-found: error
