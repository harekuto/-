name: Build Voxline 0.7.0

permissions:
  contents: write

on:
  push:
    branches: [ "voxline-0.7.0-groups-comfort" ]
    paths:
      - 'voxline-0.7.0/**'
      - '.github/workflows/build-voxline-0.7.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge JarJar
        working-directory: voxline-0.7.0
        run: gradle clean jarJar reobfJarJar --no-daemon --stacktrace
      - name: Inspect artifact
        working-directory: voxline-0.7.0
        run: |
          ls -lah build/libs
          test -f build/libs/voxline-voice-0.7.0.jar
          unzip -t build/libs/voxline-voice-0.7.0.jar
          unzip -l build/libs/voxline-voice-0.7.0.jar | grep -E 'META-INF/mods.toml|META-INF/jarjar/metadata.json|com/voxline/voice/VoxlineVoice.class'
          mkdir -p dist
          cp build/libs/voxline-voice-0.7.0.jar dist/Voxline-Voice-0.7.0-Groups-Comfort-forge-1.20.1.jar
          sha256sum dist/Voxline-Voice-0.7.0-Groups-Comfort-forge-1.20.1.jar > dist/Voxline-Voice-0.7.0-Groups-Comfort-forge-1.20.1.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Voxline-Voice-0.7.0-Groups-Comfort
          path: voxline-0.7.0/dist/*
          if-no-files-found: error
      - name: Publish downloadable JAR on build branch
        run: |
          mkdir -p release-output
          cp voxline-0.7.0/dist/Voxline-Voice-0.7.0-Groups-Comfort-forge-1.20.1.jar release-output/
          cp voxline-0.7.0/dist/Voxline-Voice-0.7.0-Groups-Comfort-forge-1.20.1.jar.sha256 release-output/
          git config user.name "Voxline Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add release-output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Voxline Voice 0.7.0 build"
          git push
