name: Build Voxline Voice 0.3.0 Final

on:
  push:
    branches:
      - 'chatgpt/voxline-voice-0.3.0'
    paths:
      - '.github/workflows/build-voxline-030-final.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euxo pipefail
          cat voxline-030-input/xz-{00..10}.b64 | base64 -d > /tmp/voxline.tar.xz
          echo '57042a36f6a6a74d1ab11615a71e6771f95cc9c068aa18a2f54fb45ed668366e  /tmp/voxline.tar.xz' | sha256sum -c -
          xz -t /tmp/voxline.tar.xz
          mkdir -p voxline
          tar -xJf /tmp/voxline.tar.xz -C voxline
          test "$(find voxline/src/main/java -name '*.java' | wc -l)" -eq 31
          grep -q '^minecraft_version=1.20.1$' voxline/gradle.properties
          grep -q '^forge_version=47.4.10$' voxline/gradle.properties
          grep -q '^mod_version=0.3.0$' voxline/gradle.properties

      - name: Apply release hardening fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Missing anchor in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('voxline/build.gradle')
          s = p.read_text(encoding='utf-8')
          dep = '    implementation "io.github.jaredmdobson:concentus:1.0.2"\n'
          if dep not in s:
              anchor = '    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"\n'
              if anchor not in s:
                  raise SystemExit('Minecraft dependency anchor missing')
              s = s.replace(anchor, anchor + dep, 1)
          if "options.compilerArgs += ['-Xlint:all', '-Werror']" not in s:
              if "options.compilerArgs += ['-Xlint:all']" in s:
                  s = s.replace("options.compilerArgs += ['-Xlint:all']", "options.compilerArgs += ['-Xlint:all', '-Werror']", 1)
              else:
                  anchor = '    options.release = 17\n'
                  if anchor not in s:
                      raise SystemExit('JavaCompile anchor missing')
                  s = s.replace(anchor, anchor + "    options.compilerArgs += ['-Xlint:all', '-Werror']\n", 1)
          p.write_text(s, encoding='utf-8')

          replace_exact('voxline/src/main/java/com/voxline/voice/VoxlineVoice.java',
                        '    public VoxlineVoice() {',
                        '    public VoxlineVoice(FMLJavaModLoadingContext context) {')
          replace_exact('voxline/src/main/java/com/voxline/voice/VoxlineVoice.java',
                        '        IEventBus modBus = FMLJavaModLoadingContext.get().getModEventBus();',
                        '        IEventBus modBus = context.getModEventBus();')
          replace_exact('voxline/src/main/java/com/voxline/voice/VoxlineVoice.java',
                        '        DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> ClientBootstrap.init(modBus));',
                        '        DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> ClientBootstrap.init(modBus, context));')

          cb = Path('voxline/src/main/java/com/voxline/voice/client/ClientBootstrap.java')
          s = cb.read_text(encoding='utf-8')
          if 'import net.minecraftforge.fml.ModLoadingContext;\n' not in s:
              raise SystemExit('ClientBootstrap legacy import missing')
          s = s.replace('import net.minecraftforge.fml.ModLoadingContext;\n',
                        'import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;\n', 1)
          if '    public static void init(IEventBus modBus) {' not in s:
              raise SystemExit('ClientBootstrap legacy init missing')
          s = s.replace('    public static void init(IEventBus modBus) {',
                        '    public static void init(IEventBus modBus, FMLJavaModLoadingContext context) {', 1)
          if '        ModLoadingContext.get().registerExtensionPoint(' not in s:
              raise SystemExit('ClientBootstrap legacy context call missing')
          s = s.replace('        ModLoadingContext.get().registerExtensionPoint(',
                        '        context.registerExtensionPoint(', 1)
          cb.write_text(s, encoding='utf-8')

          replace_exact('voxline/src/main/java/com/voxline/voice/network/VoiceNetwork.java',
                        'new ResourceLocation(VoxlineVoice.MOD_ID, "voice")',
                        'ResourceLocation.fromNamespaceAndPath(VoxlineVoice.MOD_ID, "voice")')
          PY
          grep -Fq 'implementation "io.github.jaredmdobson:concentus:1.0.2"' voxline/build.gradle
          grep -Fq "options.compilerArgs += ['-Xlint:all', '-Werror']" voxline/build.gradle
          grep -Fq 'public VoxlineVoice(FMLJavaModLoadingContext context)' voxline/src/main/java/com/voxline/voice/VoxlineVoice.java
          grep -Fq 'context.registerExtensionPoint(' voxline/src/main/java/com/voxline/voice/client/ClientBootstrap.java
          grep -Fq 'ResourceLocation.fromNamespaceAndPath' voxline/src/main/java/com/voxline/voice/network/VoiceNetwork.java
          ! grep -R --line-number --fixed-string 'FMLJavaModLoadingContext.get()' voxline/src/main/java
          ! grep -R --line-number --fixed-string 'ModLoadingContext.get()' voxline/src/main/java
          ! grep -R --line-number --fixed-string 'new ResourceLocation(' voxline/src/main/java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Static and core regression checks
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -R --line-number --fixed-string 'catch (Throwable' voxline/src/main/java
          ! grep -R --line-number -E 'm_[0-9]{3,}_' voxline/src/main/java
          ! grep -R --line-number --fixed-string 'System.out.' voxline/src/main/java
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in Path('voxline/src/main/resources').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('RESOURCE_JSON_PASS')
          PY
          rm -rf /tmp/voxline-coretest && mkdir -p /tmp/voxline-coretest
          javac --release 17 -Xlint:all -Werror -d /tmp/voxline-coretest \
            voxline/src/main/java/com/voxline/voice/audio/AudioSpec.java \
            voxline/src/main/java/com/voxline/voice/audio/AudioProcessor.java \
            voxline/src/main/java/com/voxline/voice/audio/SequenceJitterBuffer.java \
            voxline/src/coretest/java/com/voxline/voice/CoreSelfTest.java
          java -cp /tmp/voxline-coretest com.voxline.voice.CoreSelfTest | tee /tmp/coretest.log
          grep -q 'CORE_SELF_TEST: PASS' /tmp/coretest.log

      - name: Clean Forge build with warnings as errors
        working-directory: voxline
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon clean build --stacktrace

      - name: Dedicated server smoke test
        working-directory: voxline
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -f run/logs/latest.log
          rm -rf run/crash-reports
          set +e
          timeout 90s gradle --no-daemon runServer > /tmp/voxline-server.log 2>&1
          CODE=$?
          set -e
          cat /tmp/voxline-server.log
          test "$CODE" -eq 0 -o "$CODE" -eq 124
          test -f run/logs/latest.log
          grep -Fq 'Done (' run/logs/latest.log
          test ! -d run/crash-reports || test -z "$(find run/crash-reports -type f -print -quit)"
          ! grep -Eqi 'Exception in thread "main"|ModLoadingException|Failed to complete lifecycle event|Caused by:.*(NoClassDefFoundError|ClassNotFoundException)' run/logs/latest.log

      - name: Verify production JAR
        working-directory: voxline
        shell: bash
        run: |
          set -euxo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*slim*' | head -n1)"
          test -n "$JAR"
          unzip -t "$JAR"
          OUT='build/libs/Voxline-Voice-0.3.0-Forge-1.20.1-47.4.10.jar'
          cp "$JAR" "$OUT"
          unzip -p "$OUT" META-INF/mods.toml | grep -q 'modId="voxline"'
          unzip -p "$OUT" META-INF/mods.toml | grep -Fq 'versionRange="[47.4.10,48)"'
          unzip -p "$OUT" META-INF/mods.toml | grep -Fq 'versionRange="[1.20.1,1.20.2)"'
          unzip -l "$OUT" | grep -q 'com/voxline/voice/VoxlineVoice.class'
          unzip -l "$OUT" | grep -q 'META-INF/jarjar/metadata.json'
          unzip -l "$OUT" | grep -q 'META-INF/jarjar/concentus-1.0.2.jar'
          unzip -p "$OUT" META-INF/jarjar/metadata.json | grep -qi 'concentus'
          sha256sum "$OUT" | tee build/libs/SHA256SUMS.txt

      - name: Upload final production JAR
        uses: actions/upload-artifact@v4
        with:
          name: Voxline-Voice-0.3.0-Forge-1.20.1-47.4.10-final
          path: |
            voxline/build/libs/Voxline-Voice-0.3.0-Forge-1.20.1-47.4.10.jar
            voxline/build/libs/SHA256SUMS.txt
            voxline/run/logs/latest.log
          if-no-files-found: error
