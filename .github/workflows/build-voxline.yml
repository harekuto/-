name: Build Voxline Voice

on:
  push:
    branches:
      - 'chatgpt/voxline-voice-0.2.0'
    paths:
      - 'voxline-input/**'
      - '.github/workflows/build-voxline.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify transfer and reconstruct exact source
        shell: bash
        run: |
          set -euxo pipefail
          echo 'f54b992c792ec5a9ea7b1c9b589ce8eaeca8bb253f44e4b885aa3ea31fc9c5ae  voxline-input/ci-00.b64' | sha256sum -c -
          echo '8186d47941d64c9eff91cf824bc0a0ef17e843522e46748cc7b21c45a3c96db2  voxline-input/ci-01.b64' | sha256sum -c -
          echo '4d1fd1d6707ee9f85d21a35c2dc1cb29672d6b59a46244e44cf302d1f58cf16c  voxline-input/ci-02.b64' | sha256sum -c -
          echo '46c7ed392ce966b27d7d001769ebd48029c21510680dd0a5045565f10dffbeba  voxline-input/ci-03.b64' | sha256sum -c -
          echo '9bd3e5fade5fb60207e01e46c3683e65a68d4309b07fc1961f801d03ca715a3c  voxline-input/ci-04.b64' | sha256sum -c -
          echo 'd8d0efd9019a29fc5a22a8714305fe53042481e4771a45b42906a2887953af70  voxline-input/ci-05a.b64' | sha256sum -c -
          echo 'a8312a108b3b50c1cad9f05c9fd839514024a08f210f20b01ed79bdfa8940818  voxline-input/ci-05b.b64' | sha256sum -c -
          mkdir -p voxline
          cat voxline-input/ci-00.b64 voxline-input/ci-01.b64 voxline-input/ci-02.b64 voxline-input/ci-03.b64 voxline-input/ci-04.b64 voxline-input/ci-05a.b64 voxline-input/ci-05b.b64 | base64 -d > /tmp/voxline-source.zip
          echo '525e2c10ced86aa37665ae4d51070393bed19171916cce1c0825f28d065b3d4a  /tmp/voxline-source.zip' | sha256sum -c -
          unzip -t /tmp/voxline-source.zip
          unzip -q /tmp/voxline-source.zip -d voxline
          test -f voxline/build.gradle
          test -f voxline/src/main/java/com/voxline/voice/VoxlineVoice.java
          grep -q '^minecraft_version=1.20.1$' voxline/gradle.properties
          grep -q '^forge_version=47.4.10$' voxline/gradle.properties
          grep -q '^mod_version=0.2.0$' voxline/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Static source checks
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -R --line-number --fixed-string 'catch (Throwable' voxline/src/main/java
          ! grep -R --line-number -E 'm_[0-9]{3,}_' voxline/src/main/java
          ! grep -R --line-number --fixed-string 'System.out.' voxline/src/main/java
          test "$(find voxline/src/main/java -name '*.java' | wc -l)" -eq 29
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in Path('voxline/src/main/resources').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('RESOURCE_JSON_PASS')
          PY

      - name: Clean Forge build
        working-directory: voxline
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon clean build --stacktrace

      - name: Verify production artifact
        working-directory: voxline
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah build/libs
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*slim*' | head -n1)"
          test -n "$JAR"
          unzip -t "$JAR"
          OUT='build/libs/Voxline-Voice-0.2.0-Forge-1.20.1-47.4.10.jar'
          cp "$JAR" "$OUT"
          sha256sum "$OUT" | tee build/libs/SHA256SUMS.txt
          unzip -p "$OUT" META-INF/mods.toml | grep -q 'modId="voxline"'
          unzip -p "$OUT" META-INF/mods.toml | grep -Fq 'versionRange="[47.4.10,48)"'
          unzip -l "$OUT" | grep -q 'com/voxline/voice/VoxlineVoice.class'
          unzip -l "$OUT" | grep -q 'META-INF/jarjar/metadata.json'
          unzip -p "$OUT" META-INF/jarjar/metadata.json | grep -qi 'concentus'

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: Voxline-Voice-0.2.0-Forge-1.20.1-47.4.10
          path: |
            voxline/build/libs/Voxline-Voice-0.2.0-Forge-1.20.1-47.4.10.jar
            voxline/build/libs/SHA256SUMS.txt
          if-no-files-found: error
