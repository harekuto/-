name: Chronyx Android APK

on:
  push:
    branches: [ chronyx-android-alpha1 ]
    paths:
      - '.github/workflows/chronyx-android-alpha1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chronyx-android-alpha1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3
      - name: Restore verified Chronyx Mobile source
        shell: bash
        run: |
          cat chronyx-mobile-input/part-*.b64 | base64 -d > /tmp/chronyx-mobile.zip
          echo '4f29c263a8bd85b6a328f99cdc6bb59736340bd430e2eead4da0e5ea6373b9ff  /tmp/chronyx-mobile.zip' | sha256sum -c -
          mkdir -p chronyx-android
          unzip -q /tmp/chronyx-mobile.zip -d chronyx-android
      - name: Install Android SDK
        shell: bash
        run: yes | sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Lint, test and build APK
        working-directory: chronyx-android
        shell: bash
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          test -f chronyx-android/app/build/outputs/apk/debug/app-debug.apk
          cp chronyx-android/app/build/outputs/apk/debug/app-debug.apk Chronyx-Mobile-0.1.0-alpha.1.apk
          sha256sum Chronyx-Mobile-0.1.0-alpha.1.apk > Chronyx-Mobile-0.1.0-alpha.1.apk.sha256
          unzip -t Chronyx-Mobile-0.1.0-alpha.1.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: chronyx-mobile-0.1.0-alpha.1
          path: |
            Chronyx-Mobile-0.1.0-alpha.1.apk
            Chronyx-Mobile-0.1.0-alpha.1.apk.sha256
          if-no-files-found: error
          retention-days: 14
