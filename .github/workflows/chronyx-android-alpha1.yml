name: Chronyx Android Alpha2

on:
  push:
    branches: [ chronyx-android-alpha2 ]
    paths:
      - '.github/workflows/chronyx-android-alpha1.yml'
      - 'chronyx-mobile-input/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chronyx-android-alpha2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3

      - name: Restore verified alpha1 baseline and apply alpha2
        shell: bash
        run: |
          set -euo pipefail
          cat chronyx-mobile-input/part-*.b64 | base64 -d > /tmp/chronyx-mobile-alpha1.zip
          echo '4f29c263a8bd85b6a328f99cdc6bb59736340bd430e2eead4da0e5ea6373b9ff  /tmp/chronyx-mobile-alpha1.zip' | sha256sum -c -
          mkdir -p chronyx-android
          unzip -q /tmp/chronyx-mobile-alpha1.zip -d chronyx-android
          cd chronyx-android
          patch -p1 < ../chronyx-mobile-input/predictive-back.patch
          patch -p1 < ../chronyx-mobile-input/lint-fixes.patch
          patch -p1 < ../chronyx-mobile-input/alpha2-meta.patch
          patch -p1 < ../chronyx-mobile-input/alpha2-data.patch
          patch -p1 < ../chronyx-mobile-input/alpha2-main.patch
          echo '9cb8f6706c2dbc907e6c987da36aeb51cfb149838ef35002ccbfc2bc6996b844  README.md' | sha256sum -c -
          echo 'ae96b8c2096005fd256dcf6f2bf7342c463e65c9aac6e6bd4590e6574fd5074b  app/build.gradle' | sha256sum -c -
          echo '43889f93120e58252210d46f5b071d047946c96a06aa55d9925c9b89778b1f68  app/src/main/AndroidManifest.xml' | sha256sum -c -
          echo 'ba9aac790fd9a1a57acb216125fe498d94eb91206e3eceed57946e08c9dad3a5  app/src/main/java/com/chronyx/browser/mobile/BrowserDataStore.java' | sha256sum -c -
          echo 'f4a2963d1f947c75e9d46a0177e8dd669509b219b2364b469b56b053250993aa  app/src/main/java/com/chronyx/browser/mobile/MainActivity.java' | sha256sum -c -
          echo '84d49b47e6cf7496be570062b8ed5836a14ae0fd60bb2e3902ba252cd530eb15  app/src/main/java/com/chronyx/browser/mobile/SessionStore.java' | sha256sum -c -
          echo '8b4f3efb2755811c315710122aafcf35241893f135a57fd2eda25552897a7cb5  app/src/main/java/com/chronyx/browser/mobile/UrlResolver.java' | sha256sum -c -
          grep -q "versionName '0.2.0-alpha.2'" app/build.gradle
          ! grep -R "addJavascriptInterface" app/src/main
          ! grep -R "setAllowFileAccess(true)" app/src/main
          ! grep -R "MIXED_CONTENT_ALWAYS_ALLOW" app/src/main
          ! grep -R "handler.proceed()" app/src/main
          zip -qr ../Chronyx-Mobile-0.2.0-alpha.2-source.zip . -x '*/build/*' '.gradle/*'
          cd ..
          sha256sum Chronyx-Mobile-0.2.0-alpha.2-source.zip > Chronyx-Mobile-0.2.0-alpha.2-source.zip.sha256

      - name: Install Android SDK
        shell: bash
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Lint, test and build APK
        working-directory: chronyx-android
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '--- Android lint reports ---'
            find app/build/reports -type f -name 'lint-results*.txt' -print -exec cat {} \; 2>/dev/null || true
            exit "$rc"
          fi

      - name: Verify APK and signing
        shell: bash
        run: |
          set -euo pipefail
          test -f chronyx-android/app/build/outputs/apk/debug/app-debug.apk
          cp chronyx-android/app/build/outputs/apk/debug/app-debug.apk Chronyx-Mobile-0.2.0-alpha.2.apk
          sha256sum Chronyx-Mobile-0.2.0-alpha.2.apk > Chronyx-Mobile-0.2.0-alpha.2.apk.sha256
          unzip -t Chronyx-Mobile-0.2.0-alpha.2.apk >/dev/null
          test -s Chronyx-Mobile-0.2.0-alpha.2.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs Chronyx-Mobile-0.2.0-alpha.2.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging Chronyx-Mobile-0.2.0-alpha.2.apk | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: chronyx-mobile-0.2.0-alpha.2
          path: |
            Chronyx-Mobile-0.2.0-alpha.2.apk
            Chronyx-Mobile-0.2.0-alpha.2.apk.sha256
            Chronyx-Mobile-0.2.0-alpha.2-source.zip
            Chronyx-Mobile-0.2.0-alpha.2-source.zip.sha256
          if-no-files-found: error
          retention-days: 14
