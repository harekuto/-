name: Chronyx Android APK

on:
  push:
    branches: [ chronyx-android-alpha1 ]
    paths:
      - '.github/workflows/chronyx-android-alpha1.yml'
      - 'chronyx-mobile-input/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chronyx-android-alpha1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3
      - name: Restore verified Chronyx Mobile source
        shell: bash
        run: |
          cat chronyx-mobile-input/part-*.b64 | base64 -d > /tmp/chronyx-mobile.zip
          echo '4f29c263a8bd85b6a328f99cdc6bb59736340bd430e2eead4da0e5ea6373b9ff  /tmp/chronyx-mobile.zip' | sha256sum -c -
          mkdir -p chronyx-android
          unzip -q /tmp/chronyx-mobile.zip -d chronyx-android
          cd chronyx-android
          patch -p1 < ../chronyx-mobile-input/predictive-back.patch
          patch -p1 < ../chronyx-mobile-input/lint-fixes.patch
          echo 'd3101ac34b4535b7e09d35a17132779cb5ea4ae915aaaa905a4ac9bb169405a4  app/src/main/java/com/chronyx/browser/mobile/MainActivity.java' | sha256sum -c -
          echo '8ba83ac6954ebf54cadfb16e38b2fc4e000f86d04a41a4ede6a2157cfc36f957  app/src/main/java/com/chronyx/browser/mobile/UrlResolver.java' | sha256sum -c -
          echo 'cc5ab58936eb3f17bbb7b1a2dba75c21a4ea8ea72690afab7111cbe851d39610  app/src/main/AndroidManifest.xml' | sha256sum -c -
          echo 'c12f7f125acaeab07608ad4264a0857841eaf99a7e8264da4da995705291da65  app/src/main/res/values/styles.xml' | sha256sum -c -
          echo '663f9ec10d52c79fda784d847705583a12ee33cf44bb30d46c7ee60b43c95454  app/src/main/res/values-v27/styles.xml' | sha256sum -c -
          echo 'c53e30f06da02e587a81c4286277395eee892fe1217c6c45d4b386da9a63de7f  gradle.properties' | sha256sum -c -
      - name: Install Android SDK
        shell: bash
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Lint, test and build APK
        working-directory: chronyx-android
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '--- Android lint reports ---'
            find app/build/reports -type f -name 'lint-results*.txt' -print -exec cat {} \; 2>/dev/null || true
            exit "$rc"
          fi
      - name: Verify APK
        shell: bash
        run: |
          test -f chronyx-android/app/build/outputs/apk/debug/app-debug.apk
          cp chronyx-android/app/build/outputs/apk/debug/app-debug.apk Chronyx-Mobile-0.1.0-alpha.1.apk
          sha256sum Chronyx-Mobile-0.1.0-alpha.1.apk > Chronyx-Mobile-0.1.0-alpha.1.apk.sha256
          unzip -t Chronyx-Mobile-0.1.0-alpha.1.apk >/dev/null
          test -s Chronyx-Mobile-0.1.0-alpha.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chronyx-mobile-0.1.0-alpha.1
          path: |
            Chronyx-Mobile-0.1.0-alpha.1.apk
            Chronyx-Mobile-0.1.0-alpha.1.apk.sha256
          if-no-files-found: error
          retention-days: 14
