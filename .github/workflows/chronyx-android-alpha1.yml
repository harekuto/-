name: Chronyx Android Alpha4 ChatGPT

on:
  push:
    branches: [ chronyx-android-alpha4-chatgpt ]
    paths:
      - '.github/workflows/chronyx-android-alpha1.yml'
      - 'chronyx-mobile-input/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chronyx-android-alpha4-chatgpt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3

      - name: Restore verified alpha3 source and apply alpha4 ChatGPT patch
        shell: bash
        run: |
          set -euo pipefail
          cat chronyx-mobile-input/part-*.b64 | base64 -d > /tmp/chronyx-mobile-alpha1.zip
          echo '4f29c263a8bd85b6a328f99cdc6bb59736340bd430e2eead4da0e5ea6373b9ff  /tmp/chronyx-mobile-alpha1.zip' | sha256sum -c -
          mkdir -p chronyx-android
          unzip -q /tmp/chronyx-mobile-alpha1.zip -d chronyx-android
          cd chronyx-android
          patch -p1 < ../chronyx-mobile-input/predictive-back.patch
          patch -p1 < ../chronyx-mobile-input/lint-fixes.patch
          patch -p1 < ../chronyx-mobile-input/alpha2-meta.patch
          patch -p1 < ../chronyx-mobile-input/alpha2-data.patch
          patch -p1 < ../chronyx-mobile-input/alpha2-main.patch
          patch -p1 < ../chronyx-mobile-input/alpha3-release.patch
          patch -p1 < ../chronyx-mobile-input/alpha4-chatgpt-compat.patch
          echo 'a71215801f96632a8ac491d97d2f31058645cd4bc6d84fffc89bb54aa7ae2cd0  README.md' | sha256sum -c -
          echo 'f3bf5a7da8a2204d4ad9365310c0722804fbddfb10c513e4297c65ceb1efb2e9  UPDATE_POLICY.md' | sha256sum -c -
          echo '9d948cbcd0fcf3fea074a6fb4ebbac5acc87461c67f137624b550c70e1673565  app/build.gradle' | sha256sum -c -
          echo '43889f93120e58252210d46f5b071d047946c96a06aa55d9925c9b89778b1f68  app/src/main/AndroidManifest.xml' | sha256sum -c -
          echo '09fe2bf5ecf0eb14241ba9708e8dfb0811733a6652cc4796b453a95a1143da1b  app/src/main/java/com/chronyx/browser/mobile/MainActivity.java' | sha256sum -c -
          echo 'e983a1500920bf03f5f151e93ccac627ccc679720629c1fee38731aeffea4e25  app/src/main/java/com/chronyx/browser/mobile/BrowserTab.java' | sha256sum -c -
          echo '3e7c2fd05393490e37e008a26889dcfa2109b793e1b75da87fcd46a9f51e2057  app/src/main/java/com/chronyx/browser/mobile/SessionStore.java' | sha256sum -c -
          grep -q "versionCode 4" app/build.gradle
          grep -q "versionName '0.4.0-alpha.4'" app/build.gradle
          grep -q "Maximize ChatGPT web compatibility" app/src/main/java/com/chronyx/browser/mobile/MainActivity.java
          grep -q "setMediaPlaybackRequiresUserGesture(!enabled)" app/src/main/java/com/chronyx/browser/mobile/MainActivity.java
          grep -q "setAcceptThirdPartyCookies(tab.webView, enabled || sessionStore.thirdPartyCookiesEnabled())" app/src/main/java/com/chronyx/browser/mobile/MainActivity.java
          ! grep -R "addJavascriptInterface" app/src/main
          ! grep -R "setAllowFileAccess(true)" app/src/main
          ! grep -R "MIXED_CONTENT_ALWAYS_ALLOW" app/src/main
          ! grep -R "handler.proceed()" app/src/main
          zip -qr ../Chronyx-Mobile-0.4.0-alpha.4-source.zip . -x '*/build/*' '.gradle/*'
          cd ..
          sha256sum Chronyx-Mobile-0.4.0-alpha.4-source.zip > Chronyx-Mobile-0.4.0-alpha.4-source.zip.sha256

      - name: Install Android SDK
        shell: bash
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Lint and build unsigned release APK
        working-directory: chronyx-android
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintRelease :app:assembleRelease
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '--- Android lint reports ---'
            find app/build/reports -type f -name 'lint-results*.txt' -print -exec cat {} \; 2>/dev/null || true
            exit "$rc"
          fi

      - name: Verify unsigned APK and export signing tool
        shell: bash
        run: |
          set -euo pipefail
          APK=chronyx-android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          cp "$APK" Chronyx-Mobile-0.4.0-alpha.4-unsigned.apk
          unzip -t Chronyx-Mobile-0.4.0-alpha.4-unsigned.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 Chronyx-Mobile-0.4.0-alpha.4-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging Chronyx-Mobile-0.4.0-alpha.4-unsigned.apk | head -20
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner-36.0.0.jar
          test -s apksigner-36.0.0.jar
          sha256sum Chronyx-Mobile-0.4.0-alpha.4-unsigned.apk > Chronyx-Mobile-0.4.0-alpha.4-unsigned.apk.sha256
          sha256sum apksigner-36.0.0.jar > apksigner-36.0.0.jar.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: chronyx-mobile-0.4.0-alpha.4-unsigned
          path: |
            Chronyx-Mobile-0.4.0-alpha.4-unsigned.apk
            Chronyx-Mobile-0.4.0-alpha.4-unsigned.apk.sha256
            Chronyx-Mobile-0.4.0-alpha.4-source.zip
            Chronyx-Mobile-0.4.0-alpha.4-source.zip.sha256
            apksigner-36.0.0.jar
            apksigner-36.0.0.jar.sha256
          if-no-files-found: error
          retention-days: 14
