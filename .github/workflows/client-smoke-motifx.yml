name: MotifX Client Smoke

on:
  push:
    branches:
      - motifx-0.2.0-dev
    paths:
      - 'motifx/**'
      - '.github/workflows/client-smoke-motifx.yml'
  workflow_dispatch:

jobs:
  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Verify Xvfb availability
        shell: bash
        run: |
          set -euxo pipefail
          command -v xvfb-run

      - name: Forge client classloading smoke test
        working-directory: motifx
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf run
          mkdir -p run
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 timeout --signal=INT 120s xvfb-run -a gradle --no-daemon runClient
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ] && [ "$STATUS" -ne 130 ]; then exit "$STATUS"; fi
          test -f run/logs/latest.log
          grep -q 'MotifX 0.2.0-dev.3 initialized' run/logs/latest.log
          ! grep -E 'NoClassDefFoundError|ExceptionInInitializerError|ModLoadingException|InvalidDistException' run/logs/latest.log

      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MotifX-0.2.0-dev.3-client-smoke-log
          path: |
            motifx/run/logs/latest.log
            motifx/run/crash-reports/*
          if-no-files-found: ignore
