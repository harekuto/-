name: Export Forge Reobf Maps

on:
  push:
    branches: [ musordrop-8.3.0-port ]
    paths:
      - '.github/workflows/export-forge-reobf-maps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mappings:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.19.2'
            forge: '43.5.2'
            java: '17'
          - mc: '1.18.2'
            forge: '40.3.12'
            java: '17'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Download official Forge MDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/mdk /tmp/out
          curl --fail --location --retry 5 -o /tmp/mdk.zip \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/${{ matrix.mc }}-${{ matrix.forge }}/forge-${{ matrix.mc }}-${{ matrix.forge }}-mdk.zip"
          unzip -q /tmp/mdk.zip -d /tmp/mdk
          chmod +x /tmp/mdk/gradlew
      - name: Generate ForgeGradle MCP-to-SRG production mapping
        working-directory: /tmp/mdk
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon createMcpToSrg --stacktrace
          ./gradlew --no-daemon tasks --all | grep -iE 'reobf|mcp.*srg' || true
          find build "$HOME/.gradle" -type f \( -iname '*.tsrg' -o -iname '*.srg' -o -iname '*mcp*srg*' \) -print | sort > /tmp/candidates.txt
          cat /tmp/candidates.txt
          MAP="$(find build -type f \( -iname '*.tsrg' -o -iname '*.srg' -o -iname '*mcp*srg*' \) | head -n1)"
          test -n "$MAP"
          cp "$MAP" "/tmp/out/mcp-to-srg-${{ matrix.mc }}.map"
          head -30 "/tmp/out/mcp-to-srg-${{ matrix.mc }}.map"
          sha256sum /tmp/out/* > /tmp/out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-${{ matrix.mc }}-Reobf-Map
          path: /tmp/out
          if-no-files-found: error
