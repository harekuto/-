name: Mindsight Run26 Build

on:
  push:
    branches:
      - mindsight-build-run26-20260904

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Reconstruct verified Mindsight source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project mindsight-build/artifact
          cat mindsight-build/source.b64.part* | base64 --decode > mindsight-build/Mindsight-run26.zip
          echo '15d3c02c6daa09a40f1a9db13340caf7f693648f5b4349c44e1f229600e1a676  mindsight-build/Mindsight-run26.zip' | sha256sum -c -
          unzip -t mindsight-build/Mindsight-run26.zip
          unzip -q mindsight-build/Mindsight-run26.zip -d project
          test -f project/build.gradle
          test -f project/gradle.properties

      - name: Verify build toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          grep -E '^(minecraft_version|forge_version|mapping_channel|mapping_version|mod_id|mod_version)=' project/gradle.properties

      - name: Build Forge production JAR
        shell: bash
        run: |
          set -o pipefail
          cd project
          gradle clean build --stacktrace 2>&1 | tee ../mindsight-build/gradle-build.log

      - name: Inspect production JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print | head -n 1)"
          test -n "$JAR"
          unzip -t "$JAR"
          jar tf "$JAR" > mindsight-build/artifact/jar-contents.txt
          test "$(grep -c '^META-INF/mods.toml$' mindsight-build/artifact/jar-contents.txt)" -eq 1
          test "$(grep -c '^pack.mcmeta$' mindsight-build/artifact/jar-contents.txt)" -eq 1
          cp "$JAR" mindsight-build/artifact/
          sha256sum "$JAR" | tee mindsight-build/artifact/SHA256SUMS.txt
          cp mindsight-build/gradle-build.log mindsight-build/artifact/

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mindsight-run26-production
          path: |
            mindsight-build/artifact/**
            mindsight-build/gradle-build.log
          if-no-files-found: warn
          retention-days: 7
