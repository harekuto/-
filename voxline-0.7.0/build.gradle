plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group
base { archivesName = 'voxline-voice' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

jarJar.enable()

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { voxline { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    minecraftLibrary 'io.github.jaredmdobson:concentus:1.0.2'
    jarJar(group: 'io.github.jaredmdobson', name: 'concentus', version: '[1.0.2,2.0)') {
        jarJar.pin(it, '1.0.2')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:all']
}

tasks.jar.configure {
    archiveClassifier.set('slim')
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'Voxline',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Voxline'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.jarJar.configure {
    archiveClassifier.set('')
    finalizedBy 'reobfJarJar'
}

tasks.named('build') { dependsOn tasks.jarJar }
